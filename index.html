<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Convite de Casamento <b>Débora & Pedro</b></title>
  
  <meta name="description" content="Estamos muito felizes por te convidar - vê o convite aqui!" />
  
  <link rel="preload" href="logo.png" as="image" />
  <link rel="preload" href="foto_capa.png" as="image" />
  <link rel="preload" href="texto.png" as="image" />
  <link rel="preload" href="texto2.png" as="image" />
  <link rel="preload" href="only_foto.png" as="image" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app">
    <!-- ENVELOPE -->
    <section class="hero" id="hero">
      <div class="envelope-wrap">
        <p class="tap-hint" id="tapHint">Clique para abrir</p>

        <button class="envelope" id="envelopeBtn" aria-label="Abrir convite">
          <!-- FLAP -->
          <span class="env-flap-group" aria-hidden="true">
            <span class="env-flap-face env-flap-front"></span>
            <span class="env-flap-face env-flap-back"></span>
            <img class="flap-logo" src="logo.png" alt="" />
          </span>

          <!-- BODY -->
          <span class="env-mask" aria-hidden="true">
            <span class="env-back"></span>

            <!-- CARD PREVIEW -->
            <span class="env-card" aria-hidden="true">
              <img class="env-card-img" src="foto_capa.png" alt="" />
            </span>

            <!-- FRONT POCKET -->
            <span class="env-front"></span>

            <!-- OUTER STROKE -->
            <span class="env-stroke"></span>

            <!-- SEAMS (se estiveres a usar) -->
            <span class="seams" aria-hidden="true">
              <span class="seam-fold"></span>
              <span class="seam-front"></span>
            </span>
          </span>
        </button>
      </div>
    </section>

    <!-- COVER / FX -->
    <section class="cover" id="cover" hidden aria-label="Transição">
      <div class="cover-stage" id="coverStage" aria-hidden="true">
        <div class="fx" aria-hidden="true">
          <div class="fx-clip" aria-hidden="true">

            <div class="fx-photo-out" aria-hidden="true">
              <img id="photoOut" src="foto_capa.png" alt="">
            </div>

            <div class="fx-window" aria-hidden="true">
              <div class="fx-slices" id="fxSlices" data-slice-src="only_foto.png" aria-hidden="true"></div>
            </div>

            <div class="fx-text-full" aria-hidden="true">
              <img id="textFull" src="texto.png" alt="">
            </div>

          </div>
        </div>
      </div>

      <button class="handle" id="coverHandle" disabled aria-label="Clique para iniciar a transição">
        <span class="handle-bar"></span>
        <span class="handle-text">Deslizar</span>
      </button>
    </section>

    <!-- FINAL (FLIP) -->
    <section class="flip-section" id="flipSection" hidden aria-label="Convite">
      <div class="stage-center">
        <div class="stage-frame flip-stage" id="flipStage">
          <div class="flip-3d">
            <div class="flip-3d-inner" id="flipInner">

              <div class="flip-face flip-front">
                <div class="text-inner">
                  <img class="texto-img" src="texto.png" alt="Informações" />
                </div>
              </div>

              <div class="flip-face flip-back">
                <div class="text-inner">
                  <img class="texto-img" src="texto2.png" alt="Informações finais" />
                </div>
              </div>

            </div>
          </div>
        </div>

        <!-- ✅ Hint e botões fora do 3D (fixed no viewport) -->
        <div class="tap-to-flip-hint" aria-hidden="true">Clique na imagem</div>

        <div class="back-actions" aria-label="Ações">
          <button class="pill" id="btnCalendar" type="button">Guardar Evento</button>
          <button class="pill pill--ghost" id="btnSite" type="button">Site</button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
